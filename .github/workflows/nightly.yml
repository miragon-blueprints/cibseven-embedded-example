name: Nightly Checks

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80) · ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kotlin-gradle
            pitest: ./gradlew :service:app:pitest --no-daemon
            report: service/app/build/reports/pitest
          - variant: java-maven
            pitest: ./mvnw -B -ntp -pl service/app -am test-compile org.pitest:pitest-maven:mutationCoverage
            report: service/app/target/pit-reports
            java-cache: maven
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.java-cache }}

      - name: Set up Gradle
        if: matrix.variant == 'kotlin-gradle'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run PIT mutation testing
        working-directory: ${{ matrix.variant }}
        run: ${{ matrix.pitest }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report-${{ matrix.variant }}
          path: ${{ matrix.variant }}/${{ matrix.report }}
          if-no-files-found: warn

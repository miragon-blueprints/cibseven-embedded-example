server:
  port: 8081

spring:
  datasource:
    # Overridable via SPRING_DATASOURCE_* env vars for containerized/remote runs; the defaults target
    # the local dev Postgres (stack/docker-compose.yml). See CONTRIBUTING.md "Run it in containers".
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bikeleasing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    problemdetails:
      enabled: true

# A minimal, deploy/ops-ready surface. Everything else stays disabled.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Component detail is hidden. To expose it, set: show-details: always
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Keep the engine-internal /engine-rest API out of the generated frontend client.
  paths-to-match: /api/**

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    deployment-resource-pattern:
      - classpath*:**/*.bpmn
      - classpath*:**/*.dmn
      - classpath*:**/*.form
    webapp:
      # Pins the starter default for the new CIB seven webclient; Cockpit / Tasklist / Admin stay on
      # /camunda. Never set /camunda here: the classic /camunda/assets/** handler would hide the new
      # UI's bundles.
      application-path: /webapp
    database:
      type: postgres
      schema-update: true
    # Poll async-continuation jobs quickly so the process advances promptly between wait states.
    job-execution:
      wait-time-in-millis: 250
      max-wait: 1000

cibseven:
  webclient:
    # The webclient backend calls /engine-rest over HTTP. This file shadows the webclient jar's own
    # application.yaml (and its localhost:8080 default), so point it at this app's own port.
    engineRest:
      url: http://localhost:${server.port}
    authentication:

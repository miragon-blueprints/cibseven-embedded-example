version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:

  # Backend dependencies of both variants (Gradle + Maven) and the Postgres image in the dev stack,
  # grouped into one PR so the Kotlin and the Java build move to the same versions together
  - package-ecosystem: "gradle"
    directory: "/kotlin-gradle"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"

  - package-ecosystem: "maven"
    directory: "/java-maven"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  - package-ecosystem: "docker-compose"
    directory: "/stack"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  # Dev tooling (bpmnlint and its central plugin) — root-level package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      tooling-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

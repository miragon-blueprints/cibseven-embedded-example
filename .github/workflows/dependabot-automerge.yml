name: Dependabot auto-merge

on:
  pull_request:
    branches: [ main ]

# Least privilege: only what enabling auto-merge on a PR needs.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge (patch + minor)
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # patch + minor auto-merge; every major stays manual. Retry to ride out
      # the UNSTABLE window while required checks are still queued.
      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash "$PR_URL" && exit 0
            echo "enablePullRequestAutoMerge race (attempt $i) — retrying in 15s…"
            sleep 15
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

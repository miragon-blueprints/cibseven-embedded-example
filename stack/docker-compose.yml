# Local development stack. Not intended for production use.
services:
  postgres-bikeleasing:
    image: postgres:18.4
    container_name: bikeleasing-postgres
    ports:
      # Host port 5433 (not the default 5432) so this example can run alongside another
      # local Postgres that owns 5432. The container still listens on 5432 internally.
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_DB: bikeleasing
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

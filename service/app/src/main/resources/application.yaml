server:
  port: 8080

spring:
  config:
    # The CIB seven web client reads its JWT secret from this properties file (see the file for why).
    import:
      - optional:classpath:cibseven-webclient.properties
  datasource:
    # Overridable via SPRING_DATASOURCE_* env vars for containerized/remote runs; the defaults target
    # the local dev Postgres (stack/docker-compose.yml), which publishes on host port 5433 so 5432 stays
    # free for a sibling example. See CONTRIBUTING.md "Run it in containers".
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bikeleasing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    problemdetails:
      enabled: true

# A minimal, deploy/ops-ready surface. Everything else stays disabled.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Component detail is hidden. To expose it, set: show-details: always
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Keep the engine-internal /engine-rest API out of the generated frontend client.
  paths-to-match: /api/**

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    deployment-resource-pattern:
      - classpath*:**/*.bpmn
      - classpath*:**/*.dmn
      - classpath*:**/*.form
    webapp:
      # New CIB seven web client at /webapp (its default); the classic Camunda webapps
      # (Cockpit/Tasklist/Admin) stay reachable at /camunda via the legacy path.
      application-path: /webapp
      legacy-application-path: /camunda
    database:
      type: postgres
      schema-update: true
    # Poll async-continuation jobs quickly so the process advances promptly between wait states.
    job-execution:
      wait-time-in-millis: 250
      max-wait: 1000

cibseven:
  webclient:
    authentication:
      # WARNING: This is a development/example secret key.
      # DO NOT use this in production! Generate your own secure secret key.
      jwtSecret: RtURHZ7SQYfLoX902wcjlvduW2qe9g0bjMUczmffjiTjzU9phbv3mK54zHMqeGK6cqgoEBTIUE6RqwvemSqbpD40qUPXVRElvDHGhn4OAEfjeEP2ANah8GJejSA08E820mForcQHBmediqg2DzIrxnDXyf2
    # Where the web client's own REST services are mounted, RELATIVE to the /webapp application-path
    # (so the effective path is /webapp/services/v1, which is what the SPA calls). Must not repeat
    # the /webapp prefix, or the endpoints end up doubled at /webapp/webapp/services/v1.
    services:
      basePath: services/v1
    # The engine REST API the web client's backend talks to (this same embedded app).
    engineRest:
      url: ${CIBSEVEN_WEBCLIENT_ENGINE_REST_URL:http://localhost:8080}

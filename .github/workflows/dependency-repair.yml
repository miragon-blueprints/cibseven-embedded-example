name: Dependency repair

# Lets Claude shepherd a red Dependabot pull request back to green. It never merges.
on:
  workflow_run:
    workflows: [ "Pre-Merge Checks · Kotlin/Gradle", "Pre-Merge Checks · Java/Maven" ]
    types: [ completed ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair the pull request
    # Claude's own pushes re-run the checks under a different actor, so a repair never restarts itself.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: claude-maintenance
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      # An API key outranks the subscription token and would be billed per token.
      - name: Refuse to run with a pay-per-token credential
        env:
          API_CREDENTIAL_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.ANTHROPIC_AUTH_TOKEN != '' }}
        run: test "$API_CREDENTIAL_PRESENT" = "false"

      - name: Checkout the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Auto-merge is armed when Dependabot opens the pull request; a repaired one waits for a human.
      - name: Switch auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge "$PR" --disable-auto
          fi

      - name: Repair with Claude
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          plugin_marketplaces: "https://github.com/emaarco/hogwarts.git"
          plugins: "felix-felicis@emaarco"
          prompt: "/felix-felicis:dependency-update-shepherd ${{ github.event.workflow_run.pull_requests[0].number }}"

name: Pre-Merge Checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kotlin-gradle
            check: Backend build + contract drift
            build: ./gradlew build --no-daemon
          - variant: java-maven
            check: Backend build + contract drift (Java/Maven)
            build: ./mvnw -B -ntp verify
            java-cache: maven
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.java-cache }}

      - name: Set up Gradle
        if: matrix.variant == 'kotlin-gradle'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build (arch + unit + process + model validation + spec export)
        working-directory: ${{ matrix.variant }}
        run: ${{ matrix.build }}

      # The OpenAPI spec is generated by a test and committed; fail if the code and the checked-in
      # contract have drifted. Both variants export to the same file, so this also proves they expose
      # the same API. See docs/adr/0003-openapi-as-the-checked-in-contract.md.
      - name: Verify the committed OpenAPI contract is in sync
        run: git diff --exit-code -- openapi/openapi.json

  mutation:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kotlin-gradle
            check: Mutation testing (PIT, gate 80)
            sources: service/app/src/main/kotlin
            extension: kt
            pitest: ./gradlew :service:app:pitest --no-daemon -PmutationTargetClasses=
            report: service/app/build/reports/pitest
          - variant: java-maven
            check: Mutation testing (PIT, gate 80) (Java/Maven)
            sources: service/app/src/main/java
            extension: java
            pitest: ./mvnw -B -ntp -pl service/app -am -Ppit-diff test-compile org.pitest:pitest-maven:mutationCoverage -DtargetClasses=
            report: service/app/target/pit-reports
            java-cache: maven
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.java-cache }}

      - name: Set up Gradle
        if: matrix.variant == 'kotlin-gradle'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compute changed backend classes
        id: scope
        run: |
          SOURCES="${{ matrix.variant }}/${{ matrix.sources }}"
          CLASSES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- "$SOURCES" \
            | grep '\.${{ matrix.extension }}$' \
            | sed -E "s#^$SOURCES/##; s#\.${{ matrix.extension }}\$##; s#/#.#g; s#\$#*#" \
            | paste -sd, -)
          echo "classes=$CLASSES" >> "$GITHUB_OUTPUT"
          echo "Scoped mutation classes: ${CLASSES:-<none — pitest skipped>}"

      - name: Run PIT mutation testing (diff-scoped)
        if: steps.scope.outputs.classes != ''
        working-directory: ${{ matrix.variant }}
        run: ${{ matrix.pitest }}"${{ steps.scope.outputs.classes }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report-${{ matrix.variant }}
          path: ${{ matrix.variant }}/${{ matrix.report }}
          if-no-files-found: warn

  bruno:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kotlin-gradle
            check: Bruno end-to-end scenarios
            start: ./gradlew :service:app:bootRun --no-daemon
          - variant: java-maven
            check: Bruno end-to-end scenarios (Java/Maven)
            start: ./mvnw -B -ntp -DskipTests package && java -jar service/app/target/app-1.0-SNAPSHOT.jar
            java-cache: maven
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ matrix.java-cache }}

      - name: Set up Gradle
        if: matrix.variant == 'kotlin-gradle'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Start the application
        working-directory: ${{ matrix.variant }}
        run: (${{ matrix.start }}) > "$GITHUB_WORKSPACE/app.log" 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8080/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log
